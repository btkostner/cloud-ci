#:schema https://mise.jdx.dev/schema/mise.json

[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }

[tasks.generate]
description = "Generate bindings from the proto contract"
run = "mise run //packages/cloud-ci-proto:generate"

[tasks.lint]
description = "Run clippy"
depends = ["generate"]
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.format]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.test]
description = "Run unit tests"
depends = ["generate"]
run = "cargo test --locked"

[tasks.check]
description = "Run every check"
depends = ["lint", "format", "test"]

[tasks.fix]
description = "Format Rust code"
run = "cargo fmt"
