[package]
name = "cloud-ci-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "cloud-ci"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
