[package]
name = "cloud-ci-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "cloud-ci"
path = "src/main.rs"

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
cloud-ci-core = { path = "../cloud-ci-core" }
cloud-ci-proto = { path = "../cloud-ci-proto-rust" }
glob = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
ureq = "3.4.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
