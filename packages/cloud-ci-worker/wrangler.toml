name = "cloud-ci"
main = "build/index.js"
compatibility_date = "2026-09-01"

# Not secret: public identifiers / an allowlist, not a credential
# (docs/design/auth.md § "Secret storage"). Placeholders until the
# `cloud-ci setup github-app` CLI (a later round) writes the real values
# here and runs `wrangler deploy` — until then the webhook route treats a
# missing/empty GITHUB_ALLOWED_ORGS as "no org allowed" (fail closed) and
# a missing/empty GITHUB_APP_ID as unconfigured (uninstall-of-disallowed-org
# calls fail loudly rather than silently).
[vars]
GITHUB_APP_ID = ""
GITHUB_APP_CLIENT_ID = ""
GITHUB_ALLOWED_ORGS = ""
# Public URL identifier `BeginRun`'s OIDC path matches a GitHub Actions
# `id-token: write` JWT's `aud` claim against (docs/design/byo-ci.md §
# Auth row 1) — not secret, same category as GITHUB_APP_ID above.
# Placeholder until `cloud-ci setup` (a later round) writes this
# deployment's real exchange URL here.
CLOUD_CI_INGEST_AUDIENCE = ""
# Cloudflare account id the Analytics Engine SQL API's URL path needs
# (src/rollup.rs's `query_analytics_engine`, docs/design/analytics.md §
# "Querying for rollups uses the SQL API") — not secret, same
# public-identifier category as GITHUB_APP_ID above. Placeholder until
# `cloud-ci setup` writes this deployment's real account id here.
CLOUDFLARE_ACCOUNT_ID = ""

[build]
# Relative `cwd` values resolve against the invoking `wrangler` process's
# own cwd, not this file's directory (confirmed 2026-10-02 against a real
# `wrangler dev -c ... -c ...` multi-config session: `cwd = "."` failed
# with "worker-build must be run from a Rust crate directory" whenever
# this config was loaded as an auxiliary `-c` config from a different
# package's directory). This is repo-root-relative instead — every task
# that invokes `wrangler dev`/`deploy` against this config (this
# package's own `mise.toml` `dev` task, and
# `cloud-ci-dynamic-workflows-host`'s) `cd`s to the repo root first for
# exactly this reason.
command = "worker-build --release"
cwd = "packages/cloud-ci-worker"

[[d1_databases]]
binding = "DB"
database_name = "cloud-ci"
# Placeholder until the production database exists; local dev (miniflare)
# never contacts it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Raw upload bytes (reports/artifacts/sites), per ADR 0004 and
# docs/design/byo-ci.md's "Data model" § R2 keys. Binding name matches
# `env.bucket("ASSETS")` in src/lib.rs.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "cloud-ci-assets"

# Analytics Engine dataset holding the `step`/`sample`/`test`/`cache`
# event kinds docs/design/analytics.md's "Analytics Engine schema"
# section specifies (one dataset, event kind in `blob1`, `repo_id` as
# `index1`). `[[analytics_engine_datasets]]`/`binding`/`dataset` is the
# exact current Wrangler configuration syntax (verified 2026-10-02,
# developers.cloudflare.com/analytics/analytics-engine/get-started/ §
# "Name your dataset and add it to your Worker"; no dataset needs to be
# created up front — Analytics Engine creates it on first write). Binding
# name matches `env.analytics_engine("METRICS")` in
# src/coordinator/mod.rs's `write_test_events`.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "cloud_ci_metrics"

# One SQLite-backed Durable Object per run (ADR 0004, docs/design/byo-ci.md).
# Addressed by `(repo_id, sha, run_key, attempt)`, never by the run's own
# ULID, so a redelivered or reordered BeginRun always lands on the same
# instance (architecture.md's "Run identity").
[[durable_objects.bindings]]
name = "RUN_COORDINATOR"
class_name = "RunCoordinator"

# One SQLite-backed Durable Object per PR (docs/design/pr-comment.md's
# "`PullRequestState`: one writer per PR"). Addressed by
# `(repo_id, pr_number)` via `idFromName("{repo_id}/{pr_number}")`, never
# shared with `RunCoordinator`: a PR's comment spans many runs.
[[durable_objects.bindings]]
name = "PULL_REQUEST_STATE"
class_name = "PullRequestState"

# One SQLite-backed Durable Object per repo (architecture.md's "System
# shape" diagram, "Core flows" § "Managed run" step 2). Addressed by
# `repo_id` alone via `idFromName("{repo_id}")` (src/repo_state.rs module
# docs). Owns admission/concurrency decisions only this round — see that
# module's doc comment for the full scope boundary.
[[durable_objects.bindings]]
name = "REPO_STATE"
class_name = "RepoState"

# `default`-scheduling-policy container backing `ContainerProbe`
# (src/container_probe.rs): a Phase-0 proof fixture only, built from
# container_probe/Dockerfile — a bare `sleep infinity` image, not this
# repo's eventual real Containers execution image. `max_instances = 3`:
# the Dynamic Workflows DAG fixture
# (cloud-ci-dynamic-workflows-host/test/fixtures/pipeline-script-dag.js)
# addresses 3 distinct `ContainerProbe` DO instances (one per DAG node,
# via `?probe_id=`) so its fan-out nodes can run real, independent
# containers concurrently — 1 would serialize them at the container
# level even if the Workflow steps themselves ran concurrently.
[[containers]]
max_instances = 3
class_name = "ContainerProbe"
image = "./container_probe/Dockerfile"

# Not SQLite-backed by its own logic (no state.storage().sql() call), but
# uses new_sqlite_classes anyway per Cloudflare's current guidance that new
# Durable Object namespaces use the SQLite storage backend
# (developers.cloudflare.com/durable-objects/api/sqlite-storage-api/,
# checked 2026-10-02). Minimal, standalone proof DO — see
# src/container_probe.rs's module docs for its scope boundary.
[[durable_objects.bindings]]
name = "CONTAINER_PROBE"
class_name = "ContainerProbe"

# `durable_object`-scheduling-policy Container application backing
# `NodeContainer` (src/node_container.rs): `RunCoordinator::handle_start_node`'s real
# per-node container, one instance per `node_id`. Unlike `ContainerProbe` above
# (`default` policy, one fixed image from `wrangler.toml`), `durable_object` policy
# moves the image choice into the Durable Object's own code
# (`ContainerStartupOptions::set_image`, ADR 0011) — exactly what a pipeline node's
# per-node `image` needs and `default` policy cannot express. No `images` map here:
# the patched `worker` crate's `set_image` takes an arbitrary image reference string
# at call time, not one of a fixed, pre-declared set. `durable_object` policy does
# not support `max_instances` (developers.cloudflare.com/containers/configuration/scheduling-policy/,
# checked 2026-10-02).
[[containers]]
class_name = "NodeContainer"
scheduling_policy = "durable_object"

[[durable_objects.bindings]]
name = "NODE_CONTAINER"
class_name = "NodeContainer"

# new_sqlite_classes, not new_classes: RunCoordinator uses
# state.storage().sql(), which only exists on SQLite-backed objects. Never
# rewrite this entry — migrations are append-only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunCoordinator"]

# new_sqlite_classes, not new_classes: PullRequestState uses
# state.storage().sql(), same reasoning as RunCoordinator's v1 migration
# above. Migrations are append-only — never edit the v1 entry above to
# add this class to it.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PullRequestState"]

# new_sqlite_classes, not new_classes: RepoState uses
# state.storage().sql(), same reasoning as the migrations above. Never
# rewrite the v1/v2 entries — migrations are append-only.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["RepoState"]

# Picks up ContainerProbe, this round's standalone container-exec proof DO
# (src/container_probe.rs). Migrations are append-only — never rewrite
# v1-v3 above to add this class to them.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["ContainerProbe"]

# Picks up NodeContainer, this round's real per-node container DO
# (src/node_container.rs). Not SQLite-backed by its own logic (no
# state.storage().sql() call), but uses new_sqlite_classes anyway, same
# reasoning as ContainerProbe's v4 entry above. Migrations are
# append-only — never rewrite v1-v4 above to add this class to them.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["NodeContainer"]

# Installation reconcile job (docs/design/auth.md § "Multiple orgs and
# installations", "Discovery" paragraph): calls `GET /app/installations`
# and diffs it against the local `installations` table, catching a missed
# `installation.created`/`installation.deleted` webhook or an org removed
# from `GITHUB_ALLOWED_ORGS` after it was installed (see src/reconcile.rs
# and auth.md's "Failure modes" table). Every 20 minutes: this is a
# backstop for rare missed webhook deliveries, not the primary discovery
# path (the `installation`/`installation_repositories` webhooks are), so
# it does not need to run every few minutes; 20 minutes bounds the window
# a missed webhook can go unnoticed to a half hour at most while keeping
# the `GET /app/installations` call volume (and the D1 reads/writes per
# pass) low for a job whose entire purpose is catching the rare case, not
# driving normal operation.
# Analytics rollup cron (docs/design/analytics.md § "Data flow"'s
# `Cron: */15 rollup` node, src/rollup.rs): every 15 minutes, queries the
# Analytics Engine SQL API for terminal runs with no `run_rollups` row
# yet and upserts one. 15 minutes matches analytics.md's own stated
# cadence for this cron (distinct from the 20-minute installation
# reconcile cron above) — `src/lib.rs`'s single `#[event(scheduled)]`
# handler tells the two schedules apart by comparing `event.cron()`
# against each literal string below.
[triggers]
crons = ["*/15 * * * *", "*/20 * * * *"]
