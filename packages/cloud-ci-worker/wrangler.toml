name = "cloud-ci"
main = "build/index.js"
compatibility_date = "2026-09-01"

# Not secret: public identifiers / an allowlist, not a credential
# (docs/design/auth.md § "Secret storage"). Placeholders until the
# `cloud-ci setup github-app` CLI (a later round) writes the real values
# here and runs `wrangler deploy` — until then the webhook route treats a
# missing/empty GITHUB_ALLOWED_ORGS as "no org allowed" (fail closed) and
# a missing/empty GITHUB_APP_ID as unconfigured (uninstall-of-disallowed-org
# calls fail loudly rather than silently).
[vars]
GITHUB_APP_ID = ""
GITHUB_ALLOWED_ORGS = ""
# Public URL identifier `BeginRun`'s OIDC path matches a GitHub Actions
# `id-token: write` JWT's `aud` claim against (docs/design/byo-ci.md §
# Auth row 1) — not secret, same category as GITHUB_APP_ID above.
# Placeholder until `cloud-ci setup` (a later round) writes this
# deployment's real exchange URL here.
CLOUD_CI_INGEST_AUDIENCE = ""

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "cloud-ci"
# Placeholder until the production database exists; local dev (miniflare)
# never contacts it.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Raw upload bytes (reports/artifacts/sites), per ADR 0004 and
# docs/design/byo-ci.md's "Data model" § R2 keys. Binding name matches
# `env.bucket("ASSETS")` in src/lib.rs.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "cloud-ci-assets"

# One SQLite-backed Durable Object per run (ADR 0004, docs/design/byo-ci.md).
# Addressed by `(repo_id, sha, run_key, attempt)`, never by the run's own
# ULID, so a redelivered or reordered BeginRun always lands on the same
# instance (architecture.md's "Run identity").
[[durable_objects.bindings]]
name = "RUN_COORDINATOR"
class_name = "RunCoordinator"

# new_sqlite_classes, not new_classes: RunCoordinator uses
# state.storage().sql(), which only exists on SQLite-backed objects. Never
# rewrite this entry — migrations are append-only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunCoordinator"]
