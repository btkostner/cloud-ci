[package]
name = "cloud-ci-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
buffa = { version = "0.9.2", features = ["json"] }
cloud-ci-proto = { path = "../cloud-ci-proto-rust" }
cloud-ci-reports = { path = "../cloud-ci-reports" }
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey"] }
worker = { version = "0.8.7", features = ["http", "d1"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
