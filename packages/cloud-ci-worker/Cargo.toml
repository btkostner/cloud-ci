[package]
name = "cloud-ci-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
cloud-ci-proto = { path = "../cloud-ci-proto-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8.7", features = ["http"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
