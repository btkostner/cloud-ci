[package]
name = "cloud-ci-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
buffa = { version = "0.9.2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
cloud-ci-proto = { path = "../cloud-ci-proto-rust" }
cloud-ci-reports = { path = "../cloud-ci-reports" }
getrandom = { version = "0.2", features = ["js"] }
hmac = "0.12"
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "deserialization", "macros", "multi_template", "adjacent_loop_items", "std_collections", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey"] }
worker = { version = "0.8.7", features = ["http", "d1"] }

# Patches `worker` to add `durable_object`-scheduling-policy Container
# startup fields (image/instance/containerSnapshot/labels) and
# Container::exec()/ExecProcess/ExecOutput, which worker-sys/worker 0.8.7
# lack. See docs/adr/0011-patching-third-party-crates.md for why this is a
# git-pinned fork branch rather than a vendored copy, and what the diff
# against the published v0.8.7 tag is.
[patch.crates-io]
worker = { git = "https://github.com/btkostner/workers-rs", rev = "0a6f661a61f420bcce1530cec471a207367b5e8f" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
