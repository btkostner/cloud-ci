#:schema https://mise.jdx.dev/schema/mise.json

[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }
"cargo:worker-build" = "0.8.7"
wrangler = "4.145.0"
node = "24"

[tasks.lint]
description = "Run clippy"
depends = ["//packages/cloud-ci-proto:generate"]
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.format]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.test]
description = "Run unit tests"
depends = ["//packages/cloud-ci-proto:generate"]
run = "cargo test --locked"

[tasks.check]
description = "Run every check"
depends = ["lint", "format", "test"]

[tasks.fix]
description = "Format Rust code"
run = "cargo fmt"

[tasks.build]
description = "Build the Worker bundle"
depends = ["//packages/cloud-ci-proto:generate"]
run = "worker-build --release"

[tasks.dev]
description = "Run the Worker locally"
depends = ["//packages/cloud-ci-proto:generate"]
# `cd ../..` (repo root), matching `wrangler.toml`'s `[build].cwd`
# comment: relative `cwd` values in a custom build resolve against the
# invoking process's cwd, and this package's own directory is two levels
# under the repo root (`packages/<name>`).
run = "cd ../.. && wrangler dev -c packages/cloud-ci-worker/wrangler.toml"
