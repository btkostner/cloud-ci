#:schema https://mise.jdx.dev/schema/mise.json
#
# Pure TypeScript library package (no Worker of its own — this SDK is
# imported *by* `.cloud-ci/pipelines/*.ts` scripts that later run inside a
# Dynamic Worker hosted by `cloud-ci-dynamic-workflows-host`). Tool pinning
# follows that package's established convention: `node` here in `[tools]`
# (the actual runtime a task invokes), everything else (vitest, biome,
# typescript) as `package.json` `devDependencies` resolved through
# `package-lock.json`, invoked via `npx`/`npm run` against this package's
# own `node_modules`.

[tools]
node = "24"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.lint]
description = "Run biome checks"
depends = ["install"]
run = "npm run lint"

[tasks.typecheck]
description = "Run tsc --noEmit"
depends = ["install"]
run = "npm run typecheck"

[tasks.test]
description = "Run vitest unit tests"
depends = ["install"]
run = "npm run test"

[tasks.check]
description = "Run every check"
depends = ["lint", "typecheck", "test"]

[tasks.fix]
description = "Fix formatting/lint issues"
depends = ["install"]
run = "npm run fix"
