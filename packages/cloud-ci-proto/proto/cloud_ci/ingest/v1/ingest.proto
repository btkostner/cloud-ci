syntax = "proto3";

package cloud_ci.ingest.v1;

import "google/protobuf/duration.proto";

// Control plane for bring-your-own-CI uploads. Upload part bytes travel over a
// plain PUT, not this service.
service IngestService {
  rpc BeginRun(BeginRunRequest) returns (BeginRunResponse);
  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc SubmitReport(SubmitReportRequest) returns (SubmitReportResponse);
  rpc SubmitResourceSamples(SubmitResourceSamplesRequest) returns (SubmitResourceSamplesResponse);
  rpc CompleteShard(CompleteShardRequest) returns (CompleteShardResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetTestTimings(GetTestTimingsRequest) returns (GetTestTimingsResponse);
  rpc ResolveShardPlan(ResolveShardPlanRequest) returns (ResolveShardPlanResponse);
}

enum Trigger {
  TRIGGER_UNSPECIFIED = 0;
  TRIGGER_PUSH = 1;
  TRIGGER_PULL_REQUEST = 2;
  TRIGGER_MANUAL = 3;
}

enum UploadKind {
  UPLOAD_KIND_UNSPECIFIED = 0;
  UPLOAD_KIND_REPORT = 1;
  UPLOAD_KIND_ARTIFACT = 2;
  UPLOAD_KIND_SITE = 3;
}

enum Conclusion {
  CONCLUSION_UNSPECIFIED = 0;
  CONCLUSION_SUCCESS = 1;
  CONCLUSION_FAILURE = 2;
  CONCLUSION_CANCELLED = 3;
  CONCLUSION_SKIPPED = 4;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_IN_PROGRESS = 2;
  RUN_STATUS_COMPLETED = 3;
}

// Identifies a run by (repo_id, sha, run_key, attempt).
message RunKey {
  // GitHub's numeric repository id.
  uint64 repo_id = 1;
  string sha = 2;
  string run_key = 3;
  uint32 attempt = 4;
}

message BeginRunRequest {
  RunKey key = 1;
  Trigger trigger = 2;
  string external_url = 3;
  repeated string expect_jobs = 4;
  google.protobuf.Duration timeout = 5;
}

message BeginRunResponse {
  string run_id = 1;
  RunStatus status = 2;
  // Run-scoped token for every later call in this run.
  string ingest_token = 3;
}

message StartJobRequest {
  string run_id = 1;
  string job_name = 2;
  uint32 shard_total = 3;
  string runner_label = 4;
  repeated string check_names = 5;
}

message StartJobResponse {
  string job_id = 1;
}

message CreateUploadRequest {
  string job_id = 1;
  uint32 shard_index = 2;
  UploadKind kind = 3;
  string name = 4;
  string scope = 5;
  string content_type = 6;
  uint64 size_bytes = 7;
  string sha256 = 8;
}

message CreateUploadResponse {
  string upload_id = 1;
  // Zero when the upload already exists with the same identity.
  uint32 part_count = 2;
  uint64 part_size_bytes = 3;
  bool already_complete = 4;
}

message UploadPart {
  uint32 number = 1;
  string etag = 2;
}

message CompleteUploadRequest {
  string upload_id = 1;
  repeated UploadPart parts = 2;
}

message CompleteUploadResponse {}

message SubmitReportRequest {
  string job_id = 1;
  uint32 shard_index = 2;
  string report_kind = 3;
  string name = 4;
  string scope = 5;
  oneof source {
    bytes inline_data = 6;
    string upload_id = 7;
  }
}

message SubmitReportResponse {}

// One batched cgroup v2 resource sample (docs/design/analytics.md's "What
// is collected" table): `elapsed_usec` is the real wall-clock time since
// the previous sample (or job start, for the first sample), carried
// explicitly rather than re-derived from consecutive `timestamp_unix_ms`
// values downstream, so a consumer can normalize `cpu_usage_usec_delta`
// into a CPU fraction (`cpu_usage_usec_delta / elapsed_usec`) without
// needing the whole ordered batch in hand.
message ResourceSample {
  uint64 timestamp_unix_ms = 1;
  uint64 elapsed_usec = 2;
  uint64 cpu_usage_usec_delta = 3;
  uint64 memory_current_bytes = 4;
}

// One job's (or shard attempt's) complete, immutable batch of resource
// samples, submitted once at job end (docs/design/analytics.md's "Data
// flow": "the agent ... emits them as part of the job's end-of-run
// Report rather than streaming each sample individually"). `job_id` is
// used to resolve routing/auth (cross-checked against the caller's
// ingest-token claims, never trusted alone — docs/design/auth.md's
// Machine auth section); `run_id`/`repo_id` are never client-supplied
// fields, only ever inferred from the authorized job. `shard_index`
// (0-based, matching every other shard-scoped RPC in this service) and
// `attempt` (1-based; 0 is invalid) together with `job_id` form this
// batch's execution identity — resubmitting the identical batch for the
// same identity is a no-op; a *different* batch for the same identity is
// a conflict, never a silent overwrite (see `SubmitResourceSamples`'s own
// handler doc comment for the exact idempotency rule).
message SubmitResourceSamplesRequest {
  string job_id = 1;
  uint32 shard_index = 2;
  uint32 attempt = 3;
  string instance_type = 4;
  repeated ResourceSample samples = 5;
  // Unset (proto3 `optional`) when the kernel never recorded a peak
  // (`memory.peak` reads literal `max` — `cloud_ci_core::cgroup`'s
  // `parse_memory_peak` module doc) — distinct from a genuine `0`.
  optional uint64 memory_peak_bytes = 6;
  bool oom_detected = 7;
}

message SubmitResourceSamplesResponse {}

message CompleteShardRequest {
  string job_id = 1;
  uint32 shard_index = 2;
  Conclusion conclusion = 3;
  string external_url = 4;
}

message CompleteShardResponse {}

message GetRunRequest {
  RunKey key = 1;
}

message JobState {
  string job_id = 1;
  string job_name = 2;
  uint32 shard_total = 3;
  repeated uint32 completed_shards = 4;
}

message GetRunResponse {
  string run_id = 1;
  RunStatus status = 2;
  repeated JobState jobs = 3;
}

// Per-file historical duration lookup for `cloud-ci split --strategy
// timing` (docs/design/parallelization.md's "`cloud-ci split`" section),
// scoped to one repo. `file_paths` is the `--files` glob's matched set at
// `file` granularity (the only granularity `cloud-ci split` implements
// today). Read-only; never writes `test_stats`.
message GetTestTimingsRequest {
  uint64 repo_id = 1;
  repeated string file_paths = 2;
}

// One file's known historical duration, aggregated from `test_stats`
// (docs/design/analytics.md). Only present for files with at least one
// `test_stats` row; a file with no history simply has no entry here —
// the caller's `cloud_ci_core::split::HistoryLookup` contract already
// treats "no entry" as "unknown duration".
message FileTiming {
  string file_path = 1;
  uint64 duration_ms = 2;
}

message GetTestTimingsResponse {
  repeated FileTiming timings = 1;
}

// `ci.shard`'s split-resolution strategy, matching
// `cloud_ci_core::split::Strategy` and `docs/design/parallelization.md`'s
// "### Split strategies" table 1:1 (`UNSPECIFIED` is invalid, never
// resolved by a real caller).
enum SplitStrategy {
  SPLIT_STRATEGY_UNSPECIFIED = 0;
  SPLIT_STRATEGY_TIMING = 1;
  SPLIT_STRATEGY_FILE = 2;
  SPLIT_STRATEGY_COUNT = 3;
}

// `{ min, max, target }` shard-count auto-sizing, matching
// `cloud_ci_core::split::ShardCountSpec::Auto` and parallelization.md's
// "### Shard count resolution" table's object form. Only meaningful with
// `SPLIT_STRATEGY_TIMING` — the handler rejects this with any other
// strategy, same as the pure `cloud_ci_core::split::resolve_shard_count`
// it calls.
message ShardCountRange {
  uint32 min = 1;
  uint32 max = 2;
  google.protobuf.Duration target = 3;
}

// How `ci.shard`'s `count` option specifies shard count, matching
// `cloud_ci_core::split::ShardCountSpec` exactly: a fixed integer used
// as-is (after the platform's `1..64` clamp), or a `{min, max, target}`
// duration-budget auto-sizing spec.
message ShardCountSpec {
  oneof spec {
    uint32 fixed = 1;
    ShardCountRange range = 2;
  }
}

// Resolves a shard count and per-shard file assignment for one `ci.shard`
// call, per docs/design/parallelization.md's "### Deterministic
// assignment, end to end" step 2: "For managed runs, `RunCoordinator`
// computes the assignment once ... and stores it as `shard_plan` rows
// before dispatching any shard container." `file_paths` is the shard's
// `files` glob already expanded and sorted by the caller (dynamic-
// pipelines.md's "### Splitting tests across shards": the engine resolves
// the actual shard count and per-shard file assignment from this input
// list), at `file` granularity — the only granularity
// `cloud_ci_core::split` implements today (see that crate's module docs).
// Read-only against `test_stats`; never writes `shard_plan` itself — this
// RPC resolves the plan, a future `RunCoordinator` integration persists
// it (see `cloud-ci-worker`'s handler doc comment for the exact scope
// line).
message ResolveShardPlanRequest {
  uint64 repo_id = 1;
  repeated string file_paths = 2;
  SplitStrategy strategy = 3;
  ShardCountSpec count = 4;
}

// One shard's assigned file list, index 0 = shard 1 (matching
// `cloud_ci_core::split::assign`'s own "index 0 = shard 1" convention).
message ShardFiles {
  repeated string files = 1;
}

message ResolveShardPlanResponse {
  uint32 shard_count = 1;
  // Always exactly `shard_count` entries, in shard-index order.
  repeated ShardFiles shards = 2;
}
