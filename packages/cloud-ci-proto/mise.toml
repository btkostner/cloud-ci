#:schema https://mise.jdx.dev/schema/mise.json

[tools]
buf = "1.73.0"
"cargo:protoc-gen-buffa" = "0.9.2"

[tasks.generate]
description = "Generate language bindings from the proto contract"
run = [
  "rm -rf ../cloud-ci-proto-rust/generated",
  "buf generate",
]

[tasks.lint]
description = "Lint the proto contract"
run = "buf lint"

[tasks.format]
description = "Check proto formatting"
run = "buf format --diff --exit-code"

[tasks.breaking]
description = "Check the proto contract against main"
run = "buf breaking --against '../../.git#branch=main,subdir=packages/cloud-ci-proto'"

[tasks.check]
description = "Run every proto check"
depends = ["lint", "format"]

[tasks.fix]
description = "Format proto files"
run = "buf format --write"
